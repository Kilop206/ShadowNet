# Template: generate working laboratory configs with scripts/dev-certificates.py.
# Optional local exporter; never publish this port as a service.
# metrics:
#   bind_host: 127.0.0.1
#   port: 9092
#   max_connections: 4
#   timeout_ms: 2000
transport: wss
agent:
  name: home-server
  gateway_host: gateway.example.com
  port: 7443
  timeout_ms: 5000
  max_in_flight: 16
  backend_timeout_ms: 3000
  buffer_budget_bytes: 67108864
  write_timeout_ms: 10000
  reconnect:
    enabled: true
    initial_ms: 250
    max_ms: 30000
security:
  ca_file: certs/gateway-ca.crt
  certificate_file: certs/agent.crt
  private_key_file: certs/agent.key
  # crl_file: certs/gateway-ca.crl.pem
services:
  - name: api
    hostname: api.example.com
    local_host: 127.0.0.1
    local_port: 8080
    access:
      methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
      path_prefixes: [/]
  - name: website
    hostname: app.example.com
    local_host: 127.0.0.1
    local_port: 3000

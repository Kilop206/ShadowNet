# Template: replace paths and fingerprint. This is not a usable credential.
transport: wss
gateway:
  bind_host: 0.0.0.0
  port: 7443
  timeout_ms: 5000
  max_connections: 64
  heartbeat_interval_ms: 1000
  heartbeat_timeout_ms: 3000
  tunnel_buffer_budget_bytes: 134217728
  write_timeout_ms: 10000
security:
  ca_file: certs/agents-ca.crt
  certificate_file: certs/gateway.crt
  private_key_file: certs/gateway.key
authorized_agents:
  - name: home-server
    certificate_sha256: REPLACE_WITH_LOWERCASE_64_HEX_CERTIFICATE_SHA256
    services:
      - {name: api, hostname: api.example.com}
      - {name: website, hostname: app.example.com}
http:
  bind_host: 0.0.0.0
  port: 8443
  max_connections: 32
  max_in_flight: 16
  requests_per_second: 100
  request_timeout_ms: 5000
  buffer_budget_bytes: 67108864
  security:
    certificate_file: certs/public-https.crt
    private_key_file: certs/public-https.key

# Generate build/dev-pki first. Only leaf keys and CA certificates are mounted.
services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shadownet:local
    user: '${SHADOW_UID:-1000}:${SHADOW_GID:-1000}'
    command: [shadow-gateway, --config, /run/shadow/gateway.yaml]
    ports:
      - '127.0.0.1:7443:7443'
    volumes:
      - ../build/dev-pki/gateway.compose.yaml:/run/shadow/gateway.yaml:ro
      - ../build/dev-pki/ca.crt:/run/shadow/ca.crt:ro
      - ../build/dev-pki/gateway.crt:/run/shadow/gateway.crt:ro
      - ../build/dev-pki/gateway.key:/run/input/leaf.key:ro
    tmpfs:
      - '/run/shadow/private:size=1m,mode=0700,uid=${SHADOW_UID:-1000},gid=${SHADOW_GID:-1000}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  agent:
    image: shadownet:local
    pull_policy: never
    user: '${SHADOW_UID:-1000}:${SHADOW_GID:-1000}'
    depends_on: [gateway]
    command: [shadow-agent, --config, /run/shadow/agent.yaml]
    volumes:
      - ../build/dev-pki/agent.compose.yaml:/run/shadow/agent.yaml:ro
      - ../build/dev-pki/ca.crt:/run/shadow/ca.crt:ro
      - ../build/dev-pki/agent.crt:/run/shadow/agent.crt:ro
      - ../build/dev-pki/agent.key:/run/input/leaf.key:ro
    tmpfs:
      - '/run/shadow/private:size=1m,mode=0700,uid=${SHADOW_UID:-1000},gid=${SHADOW_GID:-1000}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    image: python:3.12-slim
    network_mode: service:agent
    depends_on: [agent]
    command: [python, -B, /app/server.py]
    volumes:
      - ../examples/simple-api/server.py:/app/server.py:ro
    user: '${SHADOW_UID:-1000}:${SHADOW_GID:-1000}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
